<body>
<title>ПРОгород · Внедрение ИИ в бизнес</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--green:#0F3D2E;--accent:#13795B;--bg:#F7F9F8;--ink:#16231d;--muted:#5b6b63;--line:#dfe6e2;--err:#9b1c1c;color-scheme:light}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 "PT Sans",Arial,sans-serif;margin:0}
.wrap{min-height:100vh;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
form{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:12px}
h1{font:700 24px/1.15 "PT Serif",Georgia,serif;color:var(--green);margin:0}
p{margin:0;color:var(--muted);font-size:14px}
label{font-weight:700;font-size:14px}
input{font:16px "PT Sans",sans-serif;padding:12px;border:1px solid var(--line);border-radius:8px;width:100%;box-sizing:border-box}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:700 16px "PT Sans",sans-serif;padding:12px;border:0;border-radius:8px;background:var(--green);color:#fff;cursor:pointer;min-height:44px;transition:transform 160ms ease-out}
button:active{transform:scale(0.97)}
button[disabled]{opacity:.6}
#err{color:var(--err);font-size:14px;min-height:20px}
</style>
<div class="wrap"><form id="f">
  <h1>ПРОгород · Внедрение ИИ в бизнес</h1>
  <p>Материалы закрыты паролем.</p>
  <label for="pw">Пароль</label>
  <input id="pw" type="password" autocomplete="current-password" required>
  <button id="go" type="submit">Открыть</button>
  <div id="err" role="alert"></div>
</form></div>
